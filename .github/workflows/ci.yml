name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: finance_app

env:
  DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finances
  APP_DEBUG: "false"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finances"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            uv run python -c "
          import psycopg
          psycopg.connect('postgresql://finance:finance@localhost:5432/finances').close()
          " && exit 0
            sleep 1
          done
          echo "Postgres not ready" >&2
          exit 1

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -v
