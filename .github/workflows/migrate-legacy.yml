name: Migrate Legacy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Migration mode
        required: true
        default: full
        type: choice
        options:
          - full
          - sample

defaults:
  run:
    working-directory: tools

env:
  PG_DSN: postgresql://finance:finance@localhost:5432/finances

jobs:
  migrate:
    name: Migrate and validate
    runs-on: ubuntu-latest
    environment: migration

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finances"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install tools dependencies
        run: uv sync

      - name: Install finance_app for Alembic
        working-directory: finance_app
        run: uv sync --dev

      - name: Run Alembic migrations
        working-directory: finance_app
        env:
          DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finances
        run: uv run alembic upgrade head

      - name: Migrate data from SQL Server
        working-directory: tools
        env:
          MSSQL_HOST: ${{ secrets.MSSQL_HOST }}
          MSSQL_USER: ${{ secrets.MSSQL_USER }}
          MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            uv run python migrate_data.py --full
          else
            uv run python migrate_data.py --sample 1000 --years 4
          fi

      - name: Validate migration
        working-directory: tools
        env:
          MSSQL_HOST: ${{ secrets.MSSQL_HOST }}
          MSSQL_USER: ${{ secrets.MSSQL_USER }}
          MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
        run: uv run python validate_migration.py --report-dir reports

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-acceptance-report
          path: tools/reports/*.md
